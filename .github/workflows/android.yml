name: Android

on:
  push:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name == 'main' }}

env:
  APK_ARTIFACT: tink-android-debug-apk

jobs:
  main:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run selected non-UI tests
        run: |
          ./gradlew testDebugUnitTest \
            --tests app.tinks.tink.random.RandomModelsTest \
            --tests app.tinks.tink.yt.YouTubeVideoUrlTest
      - name: Check debug APK builds
        run: ./gradlew assembleDebug

  figma-refresh:
    name: Prepare Figma refresh
    if: startsWith(github.ref, 'refs/heads/release/v') && github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify release UI changes
        shell: bash
        run: |
          python3 scripts/prepare-figma-release.py --release "$GITHUB_REF_NAME" --head "$GITHUB_SHA" \
            > "$RUNNER_TEMP/figma-refresh.md"
          cat "$RUNNER_TEMP/figma-refresh.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: figma-refresh
          path: ${{ runner.temp }}/figma-refresh.md
          if-no-files-found: error

  release-checks:
    if: startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      test_sha: ${{ steps.release.outputs.test_sha }}
    steps:
      - name: Resolve release tag and Appium test revision
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#release/}"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a release branch named release/vX.Y.Z."
            exit 1
          fi

          test_ref="$(git ls-remote --exit-code https://github.com/TinkZhang/tink-test.git refs/heads/main)"
          {
            echo "tag=$tag"
            echo "test_sha=${test_ref%%[[:space:]]*}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run all Android unit, Robolectric and screenshot tests
        run: |
          ./gradlew --continue testDebugUnitTest testReleaseUnitTest \
            jacocoDebugUnitTestReport validateDebugScreenshotTest
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/reports/screenshotTest/
            app/build/test-results/
          if-no-files-found: error
      - name: Build signed APK for Appium and release
        env:
          TINK_ANDROID_SIGNING_STORE_BASE64: ${{ secrets.TINK_ANDROID_SIGNING_STORE_BASE64 }}
          TINK_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.TINK_ANDROID_SIGNING_STORE_PASSWORD }}
          TINK_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.TINK_ANDROID_SIGNING_KEY_ALIAS }}
          TINK_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.TINK_ANDROID_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TINK_ANDROID_SIGNING_STORE_BASE64" || -z "$TINK_ANDROID_SIGNING_STORE_PASSWORD" || -z "$TINK_ANDROID_SIGNING_KEY_ALIAS" || -z "$TINK_ANDROID_SIGNING_KEY_PASSWORD" ]]; then
            echo "::error::Configure the shared Android signing secrets before publishing a release. See docs/android-signing.md."
            exit 1
          fi
          umask 077
          TINK_ANDROID_SIGNING_STORE_FILE="$(mktemp "$RUNNER_TEMP/tink-signing.XXXXXX")"
          export TINK_ANDROID_SIGNING_STORE_FILE
          trap 'unlink "$TINK_ANDROID_SIGNING_STORE_FILE"' EXIT
          printf '%s' "$TINK_ANDROID_SIGNING_STORE_BASE64" | base64 --decode > "$TINK_ANDROID_SIGNING_STORE_FILE"
          unset TINK_ANDROID_SIGNING_STORE_BASE64
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  appium:
    needs: release-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [mock, e2e]
    env:
      TINK_RUN_APPIUM: '1'
      TINK_ANDROID_SUITE: ${{ matrix.suite }}
      TINK_ANDROID_API_BASE_URL_OVERRIDE: ${{ matrix.suite == 'mock' && 'http://10.0.2.2:8765/' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: TinkZhang/tink-test
          ref: ${{ needs.release-checks.outputs.test_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: ${{ runner.temp }}/android-apk
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - name: Install Appium
        run: |
          npm install -g appium@2.19.0
          appium driver install --source=npm appium-uiautomator2-driver@4.2.9
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Appium suite
        id: appium
        continue-on-error: true
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TINK_ANDROID_APK_PATH: ${{ runner.temp }}/android-apk/app-debug.apk
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 4096 -cores 2
          script: bash .github/scripts/run_android_appium_suite.sh
      - name: Upload Appium report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-${{ matrix.suite }}
          path: reports/android/${{ matrix.suite }}/
          if-no-files-found: error
      - name: Upload Appium and Logcat logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-appium-${{ matrix.suite }}-logs
          path: |
            appium-${{ matrix.suite }}.log
            logcat-${{ matrix.suite }}.log
          if-no-files-found: ignore
      - name: Require a passing Appium suite and its report
        if: always()
        env:
          APPIUM_OUTCOME: ${{ steps.appium.outcome }}
          APPIUM_STATUS: ${{ steps.appium.outputs.status }}
        run: |
          test "$APPIUM_OUTCOME" = success
          test "$APPIUM_STATUS" = 0
          test -s "reports/android/$TINK_ANDROID_SUITE/bdd-report.html"

  publish:
    needs: [release-checks, appium]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-checks.outputs.tag }}
      TEST_SHA: ${{ needs.release-checks.outputs.test_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: android-reports
          path: release-reports/android
      - uses: actions/download-artifact@v4
        with:
          pattern: android-appium-*
          path: release-reports/appium
      - name: Publish tested APK and reports on GitHub
        shell: bash
        run: |
          set -euo pipefail

          branch_head="$(git ls-remote --exit-code origin "$GITHUB_REF")"
          if [[ "${branch_head%%[[:space:]]*}" != "$GITHUB_SHA" ]]; then
            echo "::error::The release branch moved. Use the run for its current commit."
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            if [[ "$(git rev-parse "$RELEASE_TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $RELEASE_TAG already points to a different commit."
              exit 1
            fi
          fi

          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            if [[ "$(cat release-state)" == false ]]; then
              echo "$RELEASE_TAG is already published."
              exit 0
            fi
          fi

          previous_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$RELEASE_TAG" "$GITHUB_SHA" 2>/dev/null || true)"
          apk="Tink-Super-App-${RELEASE_TAG}-debug.apk"
          mv release-assets/app-debug.apk "release-assets/$apk"
          (cd release-reports && zip -qr ../release-assets/android-test-reports.zip .)

          {
            echo '## Changes'
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --first-parent --format='- %s (%h)' "$previous_tag..$GITHUB_SHA"
            else
              git log --first-parent --format='- %s (%h)' "$GITHUB_SHA"
            fi
            echo
            echo '## Verification'
            echo
            echo 'Debug and release unit tests, Robolectric, Compose screenshots, and Appium mock and E2E passed.'
            echo
            echo "- [GitHub Actions run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo "- [Appium test source](https://github.com/TinkZhang/tink-test/tree/$TEST_SHA)"
            echo '- The APK is the debug build installed by Appium.'
            echo '- Download android-test-reports.zip for the HTML reports and logs.'
          } > release-notes.md

          # Keep a draft until every asset is uploaded, including when retrying a failed upload.
          if [[ "$(cat release-state)" != true ]]; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "Tink Android $RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" "release-assets/$apk" \
            release-assets/android-test-reports.zip --clobber
          gh release edit "$RELEASE_TAG" --draft=false --target "$GITHUB_SHA" --notes-file release-notes.md
